# What this repo reverses. Originals are never committed; they live in R2 under these keys
# and every tool verifies the sha256 before use.

project = "iw8"
title = "Call of Duty: Modern Warfare (2019) (PC, x64)"
graph = "re_iw8"
r2_public = "https://r2.houseofkublai.com/"
ghidra = "12.1.4"
# Compiler: from the exe's Rich header and debug directory (docs/builds.md).
compiler = "VS2019 16.9 (cl 19.28.29918 dominant in the Rich header, linker 14.28), x64, LTCG (POGO debug record)"
# Original source roots, for turning PDB/MAP paths into repo paths. No symbol build of IW8 is known yet.
source_roots = []

# kind: "retail"    = the final target (the build the user names; usually the final retail exe).
#       "reference" = has symbols (PDB and/or MAP): the build reconstructed first and matched to the target.
#       "related"   = no symbols, but helpful (other platforms or versions, community-named builds).
# `analyze = true` puts a build in the next Ghidra pipeline run (.github/workflows/ghidra.yml); a manual run can
# name any builds instead.
#
# `protection = "arxan"`: the code is encrypted on disk and decrypted by the entry stub at startup.
# tools/unpack/arxan.py emulates that stub (docs/arxan.md). `unpacked_sha256` pins the result, so the unpacked image
# is reproducible from the original.
#
# More game files are still being uploaded to R2 (mw2019/); each build gets an entry once hashed (docs/builds.md).

# Battle.net title update 67 (the last one: it took the original Warzone offline), linked 2024-05-13. Uploaded by
# the user from the Battle.net install. Activision Authenticode digest matches: an unmodified original. Warzone's
# code and strings are all still in it, and its zone-header checks (magics, version 11, format-version table) are
# identical to 1.63's, so it reads the 1.63 data (docs/builds.md). Arxan-protected like 1.63. No symbols.
[[build]]
id = "ModernWarfare_TU67"
kind = "retail"
analyze = true
protection = "arxan"
version = "1.67 (title update 67, strings tu67 / general_8_67)"
timestamp = "2024-05-13T20:53:26Z"
original_name = "ModernWarfare.exe"
pdb_path = 'e:\iw8\game\pc_dx12\game_dx12_ship.pdb'
pdb_guid = "0EC2F360-9741-4C0F-858D-55E76AEB36D8"
pdb_age = 2
exe = { key = "mw2019/exes/Battle.net Binaries (Modern Warfare 1.67)/ModernWarfare.exe", sha256 = "de1e9a5e540f5fe5696fd08998a410f850d9b84bee8df3ebfc581cc6ad7edf0f" }
# tools/unpack/arxan.py output (~8 min locally; identical on repeated runs)
unpacked_sha256 = "42225cb22bd4af3d59aa667b685e80ab7a66a42554184664a26bc64c3a08e81c"
# Arxan's own code (the second .text section): removed before Ghidra's analysis (tools/ghidra/DropBlocks.java) and
# kept out of the published tables.
exclude = [{ name = "arxan", start = "15A192000", end = "161F0E800" }]
ghidra_drop_excluded = true

# Battle.net build 1.63.3.12428344 (title update 63, product "odin"), from a copy labelled "1.63 by purrplee"; the
# rest of that install (CASC data) is the game data this repo reads. Activision Authenticode digest matches: an
# unmodified original. Related: the exe that matches the uploaded data exactly; code nearly identical to TU67.
[[build]]
id = "ModernWarfare_TU63"
kind = "related"
analyze = false  # not analysed yet; the pipeline was proven on it (unpack hash matched in CI, Arxan block dropped)
protection = "arxan"
version = "1.63.3.12428344"
timestamp = "2022-09-13T20:51:44Z"
original_name = "ModernWarfare.exe"
pdb_path = 'e:\workspace\iw8\game\pc_dx12\game_dx12_ship.pdb'
pdb_guid = "520C9102-599D-40A8-AC07-682F1844674D"
pdb_age = 2
exe = { key = "mw2019/Call of Duty Modern Warfare 1.63 by purrplee/Call of Duty Modern Warfare/ModernWarfare.exe", sha256 = "9eec03288a0774fb9f91f276df23bf1c2aa8ff65827352a499ddd8e806b56063" }
# tools/unpack/arxan.py output (~7 min locally): game .text decrypted (docs/arxan.md); identical on repeated runs
unpacked_sha256 = "81921e01a7dc060e18628b71b578f5f9c55e5555dbd9bb994d5b71682700a21a"
# Arxan's own code (the second .text section). Removed before Ghidra's analysis (tools/ghidra/DropBlocks.java) and
# kept out of the published tables (tools/ghidra/publish.py).
exclude = [{ name = "arxan", start = "159A09000", end = "160B07000" }]
ghidra_drop_excluded = true
