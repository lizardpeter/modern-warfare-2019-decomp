# Every push: the generated STATUS.md and graph import set are current, and (once src/ has code) the
# reconstruction compiles, every differential test passes and records/ only claims what tests prove.
# Enhanced-build steps are added with the first enhancement (docs/variants.md).
name: check

on:
  push:
  pull_request:

concurrency:
  group: iw8-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Has reconstruction
        id: recon
        run: echo "any=$(find src -name '*.cpp' 2>/dev/null | head -1 | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        if: steps.recon.outputs.any == '1'
        run: |
          sudo apt-get install -y -q clang lld llvm >/dev/null
          pip install -q unicorn==2.1.4 pefile  # the harness hooks rdtsc through unicorn_py3 internals
      - name: Fetch the target exe
        if: steps.recon.outputs.any == '1'
        run: |
          for b in $(python3 tools/model.py retail-ids 2>/dev/null); do python3 tools/fetch_originals.py "$b" .work/originals --only exe; done
      - name: Compile reconstruction
        if: steps.recon.outputs.any == '1'
        run: |
          for b in $(python3 tools/model.py retail-ids 2>/dev/null); do IW8_ORIGINALS=.work/originals python3 tools/build_recon.py --build "$b"; done
      - name: Differential tests
        if: steps.recon.outputs.any == '1'
        run: |
          for b in $(python3 tools/model.py retail-ids 2>/dev/null); do IW8_ORIGINALS=.work/originals python3 tests/differential/run.py --build "$b" --check-records; done
      - name: Generated files are current
        run: |
          python3 tools/status.py >/dev/null
          python3 tools/graph/sync.py >/dev/null
          git diff --exit-code -- STATUS.md analysis/graph || {
            echo "::error::generated files are stale: run tools/status.py and tools/graph/sync.py"; exit 1; }
      - name: Generated zone loaders are current
        run: |
          pip install --quiet pycparser==3.00
          python3 tools/assets/loaders/generate.py
          git diff --exit-code -- analysis/ModernWarfare_TU67/assets/loaders_gen.py || {
            echo "::error::loaders_gen.py differs from what tools/assets/loaders/generate.py writes"; exit 1; }
