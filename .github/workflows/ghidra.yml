# Ghidra pipeline: fetch each build, unpack it if it is Arxan-protected (tools/unpack/arxan.py), import it
# (with its original PDB when it has one), create functions reached only from data tables
# (tools/ghidra/CreateTableFunctions.java), export everything, decompile in shards, then commit the results
# to analysis/<build>/. Runs when the pipeline itself or target.toml
# changes, on the builds marked `analyze = true` in target.toml; a manual run can name any builds.
name: ghidra

on:
  workflow_dispatch:
    inputs:
      builds:
        description: "Space-separated build ids (empty: those with analyze = true in target.toml)"
        required: false
        default: ""
      analysis_run:
        description: "Run id whose saved analysis (raw-<build> artifacts, kept 5 days) to decompile and publish, skipping analysis"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - target.toml
      - tools/ghidra/**
      - tools/fetch_originals.py
      - tools/unpack/**
      - .github/workflows/ghidra.yml

concurrency:
  group: ghidra
  cancel-in-progress: false

env:
  GHIDRA_TAG: Ghidra_12.1.4_build
  SHARDS: 6

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.pick.outputs.builds }}
      shards: ${{ steps.pick.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env: { REQUESTED: "${{ github.event.inputs.builds }}" }
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, tomllib
          cfg = tomllib.load(open("target.toml", "rb"))
          req = os.environ.get("REQUESTED", "").split()
          builds = req or [b["id"] for b in cfg.get("build", []) if b.get("analyze")]
          shards = [{"build": b, "shard": s} for b in builds for s in range(int(os.environ.get("SHARDS", 6)))]
          print("builds=" + json.dumps(builds))
          print("shards=" + json.dumps(shards))
          PY

  analyze:
    needs: setup
    if: ${{ github.event.inputs.analysis_run == '' && needs.setup.outputs.builds != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.setup.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Install Ghidra
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "$GHIDRA_TAG" --repo NationalSecurityAgency/ghidra --pattern 'ghidra_*_PUBLIC_*.zip' --dir /tmp
          unzip -q /tmp/ghidra_*.zip -d /opt && mv /opt/ghidra_* /opt/ghidra
          # Ghidra 12 names the default MAXMEM_DEFAULT; PrepAnalysis.java aborts if the heap is still small
          sed -i -E 's/^#?MAXMEM(_DEFAULT)?=.*/MAXMEM\1=13G/' /opt/ghidra/support/analyzeHeadless
          grep -n 'MAXMEM' /opt/ghidra/support/analyzeHeadless; free -g
      - name: Compile the Ghidra scripts
        # every script, including the later stages', so a compile error fails here and not hours in
        run: |
          cp=$(find /opt/ghidra/Ghidra -name '*.jar' | tr '\n' ':')
          javac -nowarn -proc:none -cp "$cp" -d /tmp/ghidra-scripts tools/ghidra/*.java
      - name: Fetch originals
        run: python3 tools/fetch_originals.py ${{ matrix.build }} /tmp/in
      - name: Unpack (Arxan-protected builds only)
        timeout-minutes: 120
        run: |
          pip install -q unicorn pefile
          prot=$(python3 -c "import tomllib; b=[b for b in tomllib.load(open('target.toml','rb'))['build'] if b['id']=='${{ matrix.build }}'][0]; print(b.get('protection',''))")
          mkdir -p /tmp/raw/unpack
          if [ "$prot" = "arxan" ]; then
            mv /tmp/in/${{ matrix.build }}.exe /tmp/in/${{ matrix.build }}.packed.exe
            python3 tools/unpack/arxan.py ${{ matrix.build }} /tmp/in/${{ matrix.build }}.packed.exe /tmp/in/${{ matrix.build }}.exe /tmp/raw/unpack
          fi
      # Stage A: every analyzer except the decompiler-driven switch analysis, which stage B (job `switches`) runs.
      # Ghidra's own analysis timeout ends analysis 55 min before the step limit, so a long run still exports, writes
      # its per-analyzer timing report and saves the project instead of being killed (what happened to TU67's first run).
      - name: Analyze (with the original PDB when the build has one) and export
        timeout-minutes: 335  # backstop for a Ghidra that hangs instead of exiting
        run: |
          mkdir -p /tmp/proj /tmp/raw
          pdbargs=()
          # ghidra_pdb = false analyses a symbol build blind (as a matcher ground-truth pair); its PDB tables still
          # come from tools/pdb/extract.py
          usepdb=$(python3 -c "import tomllib; b=[b for b in tomllib.load(open('target.toml','rb'))['build'] if b['id']=='${{ matrix.build }}'][0]; print(b.get('ghidra_pdb', True))")
          # ghidra_drop_excluded = true: the build's `exclude` ranges (Arxan's own section) are removed before analysis
          droparg=()
          drop=$(python3 -c "import tomllib; b=[b for b in tomllib.load(open('target.toml','rb'))['build'] if b['id']=='${{ matrix.build }}'][0]; print(' '.join(f\"{e['start']} {e['end']}\" for e in b.get('exclude', [])) if b.get('ghidra_drop_excluded') else '')")
          if [ -n "$drop" ]; then droparg=(-preScript DropBlocks.java $drop); fi
          if [ -f /tmp/in/${{ matrix.build }}.pdb ] && [ "$usepdb" = "True" ]; then
            pdbargs=(-preScript PrepPdb.java /tmp/in/${{ matrix.build }}.pdb
                     -postScript ApplyPdbNames.java "$GITHUB_WORKSPACE/analysis/${{ matrix.build }}/pdb/locals.tsv")
          fi
          /opt/ghidra/support/analyzeHeadless /tmp/proj iw8 \
            -import /tmp/in/${{ matrix.build }}.exe \
            -scriptPath tools/ghidra \
            -preScript PrepAnalysis.java two-stage \
            "${droparg[@]}" \
            "${pdbargs[@]}" \
            -postScript CreateTableFunctions.java \
            -postScript ExportAll.java /tmp/raw \
            -analysisTimeoutPerFile 16800 \
            -log /tmp/raw/analyze.log -scriptlog /tmp/raw/analyze-scripts.log
          # record whether analysis completed; an incomplete analysis is published but flagged
          if grep -qi "analysis timed out" /tmp/raw/analyze.log; then
            echo "stage A: analysis timed out at 16800 s (incomplete)" > /tmp/raw/analysis-status.log
            echo "::warning::${{ matrix.build }}: analysis timed out at 16800 s; exported what was done"
          else
            echo "stage A: analysis completed" > /tmp/raw/analysis-status.log
          fi
          grep -A60 -i "ANALYSIS TIME" /tmp/raw/analyze.log | head -80 || true
          test -s /tmp/raw/functions.tsv || { echo "::error::Ghidra produced no export; see analyze.log"; tar -C /tmp/proj -czf /tmp/raw/project.tar.gz .; exit 1; }
          # the saved Ghidra project itself: reused by the decompile shards and committed to git
          tar -C /tmp/proj -czf /tmp/raw/project.tar.gz .
          ls -la /tmp/raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ matrix.build }}
          path: /tmp/raw
          retention-days: 5

  # Stage B: the decompiler-driven switch analysis, on the saved stage-A project, in a job of its own; then export
  # again and replace raw-<build> so the decompile shards and publish use the finished project.
  switches:
    needs: [setup, analyze]
    if: ${{ !cancelled() && github.event.inputs.analysis_run == '' && needs.setup.outputs.builds != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.setup.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Install Ghidra
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "$GHIDRA_TAG" --repo NationalSecurityAgency/ghidra --pattern 'ghidra_*_PUBLIC_*.zip' --dir /tmp
          unzip -q /tmp/ghidra_*.zip -d /opt && mv /opt/ghidra_* /opt/ghidra
          sed -i -E 's/^#?MAXMEM(_DEFAULT)?=.*/MAXMEM\1=13G/' /opt/ghidra/support/analyzeHeadless
      - uses: actions/download-artifact@v4
        with: { name: "raw-${{ matrix.build }}", path: /tmp/raw }
      - name: Switch analysis and export
        timeout-minutes: 345
        run: |
          if [ ! -s /tmp/raw/project.tar.gz ]; then echo "::error::no stage-A project for ${{ matrix.build }}"; exit 1; fi
          mkdir -p /tmp/proj && tar -C /tmp/proj -xzf /tmp/raw/project.tar.gz
          rm -f /tmp/raw/functions.tsv
          /opt/ghidra/support/analyzeHeadless /tmp/proj iw8 \
            -process ${{ matrix.build }}.exe -noanalysis \
            -scriptPath tools/ghidra \
            -preScript RunSwitchAnalysis.java 3 \
            -postScript CreateTableFunctions.java \
            -postScript ExportAll.java /tmp/raw \
            -log /tmp/raw/switches.log -scriptlog /tmp/raw/switches-scripts.log
          test -s /tmp/raw/functions.tsv || { echo "::error::stage B produced no export; see switches.log"; exit 1; }
          echo "stage B: switch analysis completed" >> /tmp/raw/analysis-status.log
          tar -C /tmp/proj -czf /tmp/raw/project.tar.gz .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: raw-${{ matrix.build }}
          path: /tmp/raw
          retention-days: 5
          overwrite: true

  decompile:
    needs: [setup, analyze, switches]
    # run each build's shards even if another build's analysis failed
    if: ${{ !cancelled() && needs.setup.outputs.builds != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Install Ghidra
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "$GHIDRA_TAG" --repo NationalSecurityAgency/ghidra --pattern 'ghidra_*_PUBLIC_*.zip' --dir /tmp
          unzip -q /tmp/ghidra_*.zip -d /opt && mv /opt/ghidra_* /opt/ghidra
          # Ghidra 12 names the default MAXMEM_DEFAULT; PrepAnalysis.java aborts if the heap is still small
          sed -i -E 's/^#?MAXMEM(_DEFAULT)?=.*/MAXMEM\1=13G/' /opt/ghidra/support/analyzeHeadless
          grep -n 'MAXMEM' /opt/ghidra/support/analyzeHeadless; free -g
      - uses: actions/download-artifact@v4
        with:
          name: "raw-${{ matrix.build }}"
          path: /tmp/raw
          # a decompile-only run takes the saved analysis of an earlier run
          run-id: ${{ github.event.inputs.analysis_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Decompile shard
        run: |
          if [ ! -s /tmp/raw/project.tar.gz ]; then echo "::error::no analysed project for ${{ matrix.build }}"; exit 1; fi
          mkdir -p /tmp/proj /tmp/out
          tar -C /tmp/proj -xzf /tmp/raw/project.tar.gz
          # functions whose signatures are committed first, so calls to them keep every argument (target.toml)
          sig=$(python3 -c "import tomllib; b=[b for b in tomllib.load(open('target.toml','rb'))['build'] if b['id']=='${{ matrix.build }}'][0]; print(' '.join(f\"{r['start']} {r['end']}\" for r in b.get('commit_signatures', [])))")
          pre=""; [ -n "$sig" ] && pre="-postScript CommitSignatures.java 2 $sig"
          # the build's obfuscated ranges (target.toml) are recorded as skipped, not decompiled
          obf=$(python3 -c "import tomllib; b=[b for b in tomllib.load(open('target.toml','rb'))['build'] if b['id']=='${{ matrix.build }}'][0]; print(' '.join(f\"{r['start']} {r['end']}\" for r in b.get('obfuscated', [])))")
          /opt/ghidra/support/analyzeHeadless /tmp/proj iw8 \
            -process ${{ matrix.build }}.exe -noanalysis -readOnly \
            -scriptPath tools/ghidra \
            $pre \
            -postScript Decompile.java /tmp/out/decomp-${{ matrix.shard }}.jsonl ${{ matrix.shard }} $SHARDS 90 $obf \
            -log /tmp/out/decompile-${{ matrix.shard }}.log -scriptlog /tmp/out/decompile-${{ matrix.shard }}-scripts.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decomp-${{ matrix.build }}-${{ matrix.shard }}
          path: /tmp/out
          retention-days: 5

  publish:
    needs: [setup, analyze, switches, decompile]
    # not after a cancel: a cancelled run's partial output must not overwrite good results
    if: ${{ !cancelled() && needs.setup.outputs.builds != '[]' }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: /tmp/art }
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.analysis_run != '' }}
        with:
          pattern: raw-*
          path: /tmp/art
          run-id: ${{ github.event.inputs.analysis_run }}
          github-token: ${{ github.token }}
      - name: Assemble analysis/<build>/
        run: |
          for b in $(echo '${{ needs.setup.outputs.builds }}' | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
            raw=/tmp/assembled/$b; mkdir -p $raw
            cp -r /tmp/art/raw-$b/. $raw/ 2>/dev/null || true
            for d in /tmp/art/decomp-$b-*; do cp -r $d/. $raw/ 2>/dev/null || true; done
            if [ -f $raw/functions.tsv ]; then python3 tools/ghidra/publish.py $b $raw; fi
            mkdir -p analysis/$b/logs analysis/$b/ghidra
            cp $raw/*.log analysis/$b/logs/ 2>/dev/null || true
            if [ -s $raw/unpack/unpack.log ]; then rm -rf analysis/$b/unpack; cp -r $raw/unpack analysis/$b/unpack; fi
            if [ -s $raw/project.tar.gz ]; then
              # Ghidra project (.gpr/.rep), split under GitHub's 100 MB file limit.
              # Restore: cat project.tar.gz.part-* | tar -xz
              rm -f analysis/$b/ghidra/project.*
              split -b 95m -d -a 2 $raw/project.tar.gz analysis/$b/ghidra/project.tar.gz.part-
              sha256sum $raw/project.tar.gz | cut -d' ' -f1 > analysis/$b/ghidra/project.tar.gz.sha256
            fi
          done
      - name: Commit
        run: |
          git config user.name "ghidra-pipeline"
          git config user.email "ghidra-pipeline@users.noreply.github.com"
          # STATUS.md and the graph import set are derived from analysis/: keep them current with it
          python3 tools/status.py >/dev/null
          python3 tools/graph/sync.py >/dev/null
          git add analysis STATUS.md
          builds=$(echo '${{ needs.setup.outputs.builds }}' | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')
          git commit -q -m "Ghidra ${GHIDRA_TAG#Ghidra_} analysis of ${builds} (${{ github.sha }})" || { echo "nothing to commit"; exit 0; }
          # analysis/ is generated: on a conflict with an older pipeline commit, this run's output wins
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && exit 0; git rebase --abort || true; sleep 10; done; exit 1
